name: Temporary TypeScript Diagnostics

on:
  push:
    branches: ["overhaul/**"]
    paths-ignore: ["lint-report.txt"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["lint-report.txt"]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"
      - run: bun install --frozen-lockfile
      - name: Write lint diagnostics\n        run: |\n          set +e\n          bun run lint > lint-report.txt 2>&1\n          code=$?\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add lint-report.txt\n          git commit -m "ci: capture TypeScript diagnostics [skip ci]" || true\n          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}} || true\n          exit $code\n