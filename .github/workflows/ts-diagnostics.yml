name: Temporary TypeScript Diagnostics

on:
  push:
    branches: ["overhaul/**"]
    paths-ignore: ["lint-report.txt"]

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"
      - run: bun install --frozen-lockfile
      - name: Write lint diagnostics
        shell: bash
        run: |
          set +e
          bun run lint > lint-report.txt 2>&1
          code=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-report.txt
          git commit -m "ci: capture TypeScript diagnostics [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
          exit $code
